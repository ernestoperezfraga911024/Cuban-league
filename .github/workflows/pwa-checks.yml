name: Cuban League · Instalación y navegación
on:
  pull_request:
    paths:
      - 'install-*'
      - 'index.html'
      - 'app.js'
      - 'player-points.js'
      - 'ideal-xi.*'
      - 'profile-chart.css'
      - 'tests/profile-chart.test.cjs'
      - 'tests/ideal-xi.test.cjs'
      - 'tests/player-points.test.cjs'
      - 'viewer-profile.js'
      - 'mister-extension/**'
      - 'mister-import-core.js'
      - 'mister-mobile*'
      - 'scripts/*mobile-mister*'
      - 'second-division-admin.js'
      - 'tests/second-division.test.cjs'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'tests/mister-*.test.cjs'
      - 'supabase/migrations/*_mister_official_xi.sql'
      - 'supabase/migrations/*_mister_player_goals.sql'
      - 'scripts/backfill-player-goals-*.sql'
      - 'sw.js'
      - 'tests/install-welcome.test.cjs'
      - '.github/workflows/pwa-checks.yml'
  push:
    branches: [main]
    paths:
      - 'install-*'
      - 'index.html'
      - 'app.js'
      - 'player-points.js'
      - 'ideal-xi.*'
      - 'profile-chart.css'
      - 'tests/profile-chart.test.cjs'
      - 'tests/ideal-xi.test.cjs'
      - 'tests/player-points.test.cjs'
      - 'viewer-profile.js'
      - 'mister-extension/**'
      - 'mister-import-core.js'
      - 'mister-mobile*'
      - 'scripts/*mobile-mister*'
      - 'second-division-admin.js'
      - 'tests/second-division.test.cjs'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'tests/mister-*.test.cjs'
      - 'supabase/migrations/*_mister_official_xi.sql'
      - 'supabase/migrations/*_mister_player_goals.sql'
      - 'scripts/backfill-player-goals-*.sql'
      - 'sw.js'
      - 'tests/install-welcome.test.cjs'
      - '.github/workflows/pwa-checks.yml'
permissions:
  contents: read
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/install-welcome.test.cjs tests/viewer-profile.test.cjs tests/navigation-motion.test.cjs tests/public-loading.test.cjs tests/forecast-player-sheet.test.cjs tests/player-points.test.cjs tests/ideal-xi.test.cjs tests/profile-chart.test.cjs
      - run: node --test tests/mister-pipeline.test.cjs tests/mister-transport.test.cjs tests/mister-mobile.test.cjs tests/second-division.test.cjs tests/mister-official-xi-*.test.cjs
