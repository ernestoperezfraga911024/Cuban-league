name: Cuban League · Instalación y navegación
on:
  pull_request:
    paths:
      - 'install-*'
      - 'index.html'
      - 'app.js'
      - 'viewer-profile.js'
      - 'sw.js'
      - 'tests/install-welcome.test.cjs'
      - '.github/workflows/pwa-checks.yml'
  push:
    branches: [main]
    paths:
      - 'install-*'
      - 'index.html'
      - 'app.js'
      - 'viewer-profile.js'
      - 'sw.js'
      - 'tests/install-welcome.test.cjs'
      - '.github/workflows/pwa-checks.yml'
permissions:
  contents: read
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/install-welcome.test.cjs tests/viewer-profile.test.cjs tests/navigation-motion.test.cjs tests/public-loading.test.cjs tests/forecast-player-sheet.test.cjs
